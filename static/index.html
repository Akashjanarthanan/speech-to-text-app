<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech to Text</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header><div><span class="eyebrow">VOICE WORKSPACE</span><h1>Speech to Text</h1><p>Capture speech, transcribe it, and keep your notes organized.</p></div><span class="pill">Whisper · Local model</span></header>
  <section class="panel recorder">
    <h2>New transcription</h2>
    <div class="record-actions">
      <button id="startBtn" class="primary">● Start recording</button>
      <button id="stopBtn" disabled>■ Stop recording</button>
    </div>
    <p id="recordStatus" class="status">Ready. Recording is transcribed after you stop.</p>
    <label for="transcriptBox">Transcript</label>
    <textarea id="transcriptBox" rows="6" placeholder="Recognized text will appear here. You can also type or edit it."></textarea>
    <div class="save-row"><input id="titleInput" placeholder="Transcript title" value="My transcription"><button id="saveBtn" class="primary">Save transcript</button></div>
  </section>
  <section class="panel">
    <div class="history-head"><div><h2>History</h2><p>Saved transcriptions</p></div><button id="refreshBtn">Refresh</button></div>
    <div id="history" class="history"><p class="muted">Loading…</p></div>
  </section>
</div>
<div id="toast" role="status"></div>
<script src="/static/script.js"></script>
</body>
</html>
